<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Orçamento Cortinas e Persianas</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; }
label { display: block; margin-top: 10px; }
input, select { width: 100%; padding: 6px; margin-top: 4px; }
button { margin-top: 20px; padding: 10px; width: 100%; font-size: 16px; }
.hidden { display: none; }
.resultado { margin-top: 20px; font-weight: bold; }
</style>
</head>

<body>

<h1>Orçamento</h1>

<label>Tipo de orçamento</label>
<select id="categoria" onchange="trocarCategoria()">
  <option value="">Selecione</option>
  <option value="persiana">Persiana</option>
  <option value="cortina">Cortina comum</option>
  <option value="pedireito">Cortina pé-direito duplo</option>
</select>

<!-- PERSIANA -->
<div id="persiana" class="hidden">
<h2>Persiana</h2>

<label>Modelo</label>
<select id="modelo" onchange="carregarMateriais()">
  <option value="">Selecione</option>
  <option value="rolo">Rolô</option>
  <option value="romana">Romana</option>
  <option value="double">Double Vision</option>
  <option value="vertical">Vertical</option>
  <option value="horizontal">Horizontal</option>
</select>

<label>Material</label>
<select id="material"></select>

<label>Largura (m)</label>
<input type="number" id="largura" step="0.01">

<label>Altura (m)</label>
<input type="number" id="altura" step="0.01">

<label>
  <input type="checkbox" id="bando"> Adicionar bandô
</label>

<label>Desconto (%)</label>
<input type="number" id="desconto" value="0">

<button onclick="calcularPersiana()">Calcular</button>
</div>

<!-- CORTINA COMUM -->
<div id="cortina" class="hidden">
<h2>Cortina comum</h2>

<label>Largura (m)</label>
<input type="number" id="larguraC" step="0.01">

<label>Altura (m)</label>
<input type="number" id="alturaC" step="0.01">

<label>Valor do tecido (m²)</label>
<input type="number" id="valorTecido">

<label>Valor do trilho (ml)</label>
<input type="number" id="valorTrilho">

<label>Confecção</label>
<input type="number" id="confeccao">

<label>Instalação</label>
<input type="number" id="instalacao">

<label>Desconto (%)</label>
<input type="number" id="descontoC" value="0">

<button onclick="calcularCortina()">Calcular</button>
</div>

<!-- PÉ DIREITO DUPLO -->
<div id="pedireito" class="hidden">
<h2>Cortina Pé-Direito Duplo</h2>

<label>Largura do vão (m)</label>
<input type="number" id="pdL" step="0.01">

<label>Altura do vão (m)</label>
<input type="number" id="pdA" step="0.01">

<label>Valor do tecido (metro)</label>
<input type="number" id="pdValor">

<label>Desconto (%)</label>
<input type="number" id="pdDesconto" value="0">

<button onclick="calcularPeDireito()">Calcular</button>
</div>

<div class="resultado" id="resultado"></div>

<script>
function trocarCategoria() {
  const secoes = ["persiana", "cortina", "pedireito"];
  secoes.forEach(id => document.getElementById(id).classList.add("hidden"));

  const categoria = document.getElementById("categoria").value;
  if (categoria) {
    document.getElementById(categoria).classList.remove("hidden");
  }

  document.getElementById("resultado").innerHTML = "";
}

const dados = {
  rolo: { materiais:{translucida:101, solar1:117, solar3:98, blackout:129}, bando:56 },
  romana:{ materiais:{translucida:136, solar1:144, solar3:125, blackout:174}, bando:20 },
  double:{ materiais:{basic:172}, bando:26 },
  vertical:{ materiais:{translucida:80, blackout:120}, bando:50 },
  horizontal:{ materiais:{aluminio:108}, bando:0 }
};

function carregarMateriais() {
  const modelo = document.getElementById("modelo").value;
  const material = document.getElementById("material");
  material.innerHTML = "";

  if (!modelo) return;

  Object.keys(dados[modelo].materiais).forEach(m => {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m;
    material.appendChild(opt);
  });
}

function calcularPersiana() {
  const modelo = modeloSel.value = document.getElementById("modelo").value;
  const mat = document.getElementById("material").value;
  const L = +largura.value;
  const A = +altura.value;

  let area = L * A;
  if (area < 1.5) area = 1.5;

  let subtotal = area * dados[modelo].materiais[mat] + 75;

  if (bando.checked) subtotal += L * dados[modelo].bando;
  if (modelo === "rolo" && L > 1.9) subtotal += 30;

  let venda = subtotal * 2;
  let desc = venda * (+desconto.value / 100);

  resultado.innerHTML = Valor final: R$ ${(venda - desc).toFixed(2)};
}

function calcularCortina() {
  let subtotal =
    (+larguraC.value * +alturaC.value * +valorTecido.value) +
    (+larguraC.value * +valorTrilho.value) +
    (+confeccao.value) +
    (+instalacao.value);

  let venda = subtotal * 2;
  let desc = venda * (+descontoC.value / 100);

  resultado.innerHTML = Valor final: R$ ${(venda - desc).toFixed(2)};
}

function calcularPeDireito() {
  const L = +pdL.value;
  const A = +pdA.value;
  const tecido = +pdValor.value;

  const larguraTecido = 3.3;
  const barra = 0.6;

  const larguraFinal = L * 3;
  let alturas = larguraFinal / larguraTecido;
  alturas = alturas <= 3.5 ? Math.floor(alturas) : Math.ceil(alturas);

  const metragem = (A + barra) * alturas;
  const tecidoTotal = metragem * tecido;
  const confeccao = L * 100;
  const trilho = L * 100;
  const instalacao = 150;

  let subtotal = tecidoTotal + confeccao + trilho + instalacao;
  let venda = subtotal * 2;
  let desc = venda * (+pdDesconto.value / 100);

  resultado.innerHTML = Valor final: R$ ${(venda - desc).toFixed(2)};
}
</script>

</body>
</html>
